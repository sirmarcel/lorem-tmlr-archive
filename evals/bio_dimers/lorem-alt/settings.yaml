batcher:
  batch_size: 32
  max_total_atoms: 1024
checkpointers: full
correct_mean: true
decay_style: linear
default_matmul_precision: float32
loss_weights:
  energy: 0.5
  forces: 0.5
max_epochs: 4000
min_learning_rate: 1e-6
optimizer: adam
scale_by_variance: false
seed: 42
start_decay_after: 10
start_learning_rate: 1e-4
train: bio_dimers_train
use_wandb: false
valid: bio_dimers_valid
valid_every_epoch: 2
worker_buffer_size: 2
worker_count: 4
